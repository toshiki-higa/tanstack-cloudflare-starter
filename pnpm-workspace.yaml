strictDepBuilds: true # Block dependency lifecycle scripts by default
allowBuilds: # Permit only required native/runtime builds
  esbuild: true # Platform-specific binary
  lightningcss: true # Tailwind CSS native binary
  msgpackr-extract: false # Optional native acceleration; use the JavaScript fallback
  sharp: true # Wrangler image processing
  unrs-resolver: true # Cloudflare Vite plugin native resolver
  workerd: true # Cloudflare Workers runtime
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1 # Transitive dependency of Babel through vite-plugin-solid

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
blockExoticSubdeps: true
verifyDepsBeforeRun: warn # Warn instead of automatically installing before scripts

configDependencies:
  '@pnpm/pacquet': 0.11.12

saveExact: true
enableGlobalVirtualStore: true
catalogMode: strict

catalogs:
  app:
    '@hono/valibot-validator': 0.6.1
    '@tanstack/solid-query': 5.101.4
    '@tanstack/solid-router': 1.170.18
    '@tanstack/solid-router-ssr-query': 1.167.1
    '@tanstack/solid-start': 1.168.32
    hono: 4.12.31
    solid-js: 1.9.14
    valibot: 1.4.2
  infra:
    '@effect/platform-node': 4.0.0-beta.100
    alchemy: 2.0.0-beta.64
    effect: 4.0.0-beta.100
  lint:
    '@secretlint/secretlint-rule-preset-recommend': 13.0.4
    '@tanstack/eslint-plugin-query': 5.101.4
    '@tanstack/eslint-plugin-router': 1.162.0
    eslint-plugin-solid: 0.14.5
    fallow: 3.8.0
    secretlint: 13.0.4
  tooling:
    '@dotenvx/dotenvx': 2.17.2
    '@tailwindcss/vite': 4.3.3
    '@tanstack/solid-router-devtools': 1.167.0
    portless: 0.15.4
    tailwindcss: 4.3.3
    typescript: 7.0.2
    vite: 8.1.5
    vite-bundle-visualizer: 1.2.1
    vite-plugin-solid: 2.11.13
    vite-plus: &vite-plus 0.2.6
    vitest: 4.1.10
  types:
    '@cloudflare/workers-types': 5.20260721.1
    '@types/node': 26.1.1

packages: []

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vitest: 4.1.10

packageExtensions:
  '@voidzero-dev/vite-plus-core@*':
    dependencies:
      vite-plus: *vite-plus

peerDependencyRules:
  allowedVersions:
    '@distilled.cloud/cloudflare': 0.30.1 # Alchemy beta ships this with a stale ^0.29 peer range
    typescript: 7.0.2 # ESLint plugins work with the configured TypeScript prerelease
    vite: '*' # Vite+ core exposes Vite 8 under its own package version
